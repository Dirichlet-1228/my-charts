        }

        }
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .chart-title {
            flex-shrink: 0;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 16px 0 12px;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }
        @media (max-width:768px) {
            .chart-title {
                font-size: 16px;
            }
            .chart-container {
                min-height: 250px;
            }

                if (typeof v === 'string') return parseFloat(v.replace(/,/g, '')) || 0;
                if (typeof v === 'number') return v;
                return 0;
            }

            // Y轴格式化：超过10000使用万
            function formatYAxis(value) {
                if (Math.abs(value) >= 10000) {
                    return (value / 10000).toFixed(value % 10000 === 0 ? 0 : 1) + '万';
                }
                return value.toString();
            }

            // 金额格式化
            function formatMoney(value) {
                if (Math.abs(value) >= 1000000) {
                    return '$' + (value / 1000000).toFixed(2) + 'M';
                }
                if (Math.abs(value) >= 1000) {
                    return '$' + (value / 1000).toFixed(1) + 'K';

                let chartId = parseInt(params.get('id')) || 1;
                if (chartId < 1 || chartId > 20) chartId = 1;

                const titleEl = document.getElementById('chartTitle');
                const containerEl = document.getElementById('singleChart');

                titleEl.textContent = chartTitles[chartId - 1] || '';
                if (!titleEl.textContent) {
                    titleEl.style.display = 'none';
                } else {
                    titleEl.style.display = '';
                }

                const optFn = chartOptFns[chartId - 1];
                const option = optFn();

                // 销毁旧实例
                if (containerEl._echartInstance) {
                    containerEl._echartInstance.dispose();
                }
                const chart = echarts.init(containerEl);
                containerEl._echartInstance = chart;
                chart.setOption(option);

                // 延迟resize确保正确渲染

                    chart.resize();
                }, 100);

                // 响应式监听

                    if (containerEl._echartInstance) {
                        containerEl._echartInstance.resize();
                    }
                });
            }
