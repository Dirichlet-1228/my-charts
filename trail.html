<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据可视化看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            margin: 0;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .chart-title {
            flex-shrink: 0;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 16px 0 12px;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }
        @media (max-width:768px) {
            .chart-title {
                font-size: 16px;
            }
            .chart-container {
                min-height: 250px;
            }
        }
    </style>
</head>

            function parseNum(v) {
                if (v === null || v === undefined || v === '') return null;
                if (typeof v === 'number') return v;
                return parseFloat(String(v).replace(/,/g, '')) || 0;
            }

            function formatAxisValue(v) {
                if (v >= 10000) return (v / 10000).toFixed(v % 10000 === 0 ? 0 : 1) + '万';
                if (v >= 1000) return (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + 'K';

                    type: 'category',

                    axisLine: { lineStyle: { color: '#ccc' } },
                    axisTick: { show: false },
                    axisLabel: { color: '#666', fontSize: 11, rotate: opts.rotate || 0 },

            // ==================== 初始化 ====================
            const params = new URLSearchParams(window.location.search);
            let chartId = parseInt(params.get('id')) || 1;
            if (chartId < 1 || chartId > 20 || isNaN(chartId)) chartId = 1;

            document.getElementById('chartTitle').textContent = chartTitles[chartId - 1];
            const container = document.getElementById('singleChart');
            const chart = echarts.init(container);

            const optsFn = chartOpts[chartId - 1];
            const opts = optsFn();
            chart.setOption(opts);

            setTimeout(function() { chart.resize(); }, 100);

            window.addEventListener('resize', function() {

            });
        })();
