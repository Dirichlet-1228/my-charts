                // ---- 图表16：价格-质量联动分析（无数据） ----
                opts.push({
                    tooltip: { trigger: 'axis', backgroundColor: 'rgba(0,0,0,0.7)', textStyle: { color: '#fff' } },
                    grid: { left: '3%', right: '6%', bottom: '8%', top: '5%', containLabel: true },
                    xAxis: { type: 'category', data: [], axisLabel: { color: '#666' } },
                    yAxis: { type: 'value', axisLabel: { color: '#666' },
                    splitLine: { lineStyle: { color: '#E9ECEF', type: 'dashed' } } },
                    series: []
                });

                // ---- 图表17：品牌价格分布（无数据） ----
                opts.push({
                    tooltip: { trigger: 'axis', backgroundColor: 'rgba(0,0,0,0.7)', textStyle: { color: '#fff' } },
                    grid: { left: '3%', right: '6%', bottom: '8%', top: '5%', containLabel: true },
                    xAxis: { type: 'category', data: [], axisLabel: { color: '#666' } },
                    yAxis: { type: 'value', axisLabel: { color: '#666' },
                    splitLine: { lineStyle: { color: '#E9ECEF', type: 'dashed' } } },
                    series: []
                });

                // ---- 图表18：新老品价格分布（无数据） ----
                opts.push({
                    tooltip: { trigger: 'axis', backgroundColor: 'rgba(0,0,0,0.7)', textStyle: { color: '#fff' } },
                    grid: { left: '3%', right: '6%', bottom: '8%', top: '5%', containLabel: true },
                    xAxis: { type: 'category', data: [], axisLabel: { color: '#666' } },
                    yAxis: { type: 'value', axisLabel: { color: '#666' },
                    splitLine: { lineStyle: { color: '#E9ECEF', type: 'dashed' } } },
                    series: []
                });

                // ---- 图表19：分款星级分布-堆积柱状图 ----
                const styleNames19 = ['描图灯箱/LED灯板', '智能App投影仪', 'AI投影仪', '传统插片投影仪'];
                const starData19 = [starMiaotu, starZhinen, starAI, starChuantong];
                const series19 = styleNames19.map((name, i) => ({
                    name: name,
                    type: 'bar',
                    stack: 'total',
                    data: starData19[i],
                    itemStyle: { color: COLORS[i] },
                    emphasis: { focus: 'series' },
                    barMaxWidth: 50,
                    label: {
                        show: true,
                        position: 'inside',
                        fontSize: 11,
                        color: '#fff',
                        formatter: function(p) { return p.value > 0 ? p.value : ''; }
                    }
                }));
                opts.push({
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(0,0,0,0.7)',
                        textStyle: { color: '#fff' },
                        formatter: function(params) {
                            let html = params[0].axisValue + '<br/>';
                            params.forEach(function(p) {
                                html += '<span style="display:inline-block;width:10px;height:10px;background:' +
                                    p.color + ';margin-right:6px;"></span>';
                                html += p.seriesName + ': ' + p.value + '<br/>';
                            });
                            return html;
                        }
                    },
                    legend: {
                        data: styleNames19,
                        type: 'scroll',
                        orient: 'horizontal',
                        bottom: 0,
                        textStyle: { color: '#333' }
                    },
                    grid: { left: '3%', right: '6%', bottom: '10%', top: '5%', containLabel: true },
                    xAxis: {
                        type: 'category',
                        data: starLevels,
                        axisLabel: { color: '#666', fontSize: 12 },
                        axisLine: { lineStyle: { color: '#ccc' } }
                    },
                    yAxis: {
                        type: 'value',
                        name: '数量',
                        axisLabel: { color: '#666' },
                        splitLine: { lineStyle: { color: '#E9ECEF', type: 'dashed' } },
                        nameTextStyle: { color: '#666' }
                    },
                    series: series19
                });

                // ---- 图表20：评分销量趋势-折线图（无数据） ----
                opts.push({
                    tooltip: { trigger: 'axis', backgroundColor: 'rgba(0,0,0,0.7)', textStyle: { color: '#fff' } },
                    grid: { left: '3%', right: '6%', bottom: '8%', top: '5%', containLabel: true },
                    xAxis: { type: 'category', data: [], axisLabel: { color: '#666' } },
                    yAxis: { type: 'value', axisLabel: { color: '#666' },
                    splitLine: { lineStyle: { color: '#E9ECEF', type: 'dashed' } } },
                    series: []
                });

                return opts;
            }

            const chartOpts = buildChartOpts();

            // ============ URL参数解析 ============
            function getChartId() {
                const params = new URLSearchParams(window.location.search);
                let id = parseInt(params.get('id'), 10);
                if (isNaN(id) || id < 1 || id > 20) {
                    id = 1;
                }
                return id;
            }

            const chartId = getChartId();
            const titleEl = document.getElementById('chartTitle');
            const containerEl = document.getElementById('singleChart');

            // 设置标题
            const titleText = chartTitles[chartId - 1] || '';
            titleEl.textContent = titleText;
            if (!titleText) {
                titleEl.style.display = 'none';
            } else {
                titleEl.style.display = '';
            }

            // 获取配置
            const opt = chartOpts[chartId - 1];

            // 初始化图表
            const chart = echarts.init(containerEl);

            // 对于饼图（无数据的图表1-4,9,11-13），使用特殊空配置
            const pieIds = [1, 2, 3, 4, 9, 11, 12, 13];
            if (pieIds.includes(chartId) && (!opt.series[0].data || opt.series[0].data.length === 0)) {
                // 空饼图显示占位
                const emptyPieOpt = {
                    tooltip: { trigger: 'item', backgroundColor: 'rgba(0,0,0,0.7)', textStyle: { color: '#fff' } },
                    series: [{
                        type: 'pie',
                        data: [{ value: 1, name: '暂无数据', itemStyle: { color: '#E9ECEF' } }],
                        radius: ['45%', '70%'],
                        center: ['50%', '50%'],
                        label: {
                            show: true,
                            formatter: '暂无数据',
                            color: '#999',
                            fontSize: 14,
                            position: 'center'
                        },
                        emphasis: { label: { show: true, fontSize: 16 } },
                        silent: true
                    }]
                };
                chart.setOption(emptyPieOpt);
            } else {
                chart.setOption(opt);
            }

            // 响应式处理
            setTimeout(function() {
                chart.resize();
            }, 100);

            window.addEventListener('resize', function() {
                chart.resize();
            });

            // 输出当前渲染的图表ID
            console.log('当前渲染图表ID: ' + chartId + (titleText ? ' - ' + titleText : ''));
        })();
    </script>
</body>
</html>
