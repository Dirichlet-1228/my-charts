<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>数据可视化图表</title>

    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            margin: 0;
            background: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background: transparent;
        }
        .chart-title {
            flex-shrink: 0;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 16px 0 12px;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            min-height: 300px;
            background: transparent;
        }
        @media (max-width: 768px) {
            .chart-title {
                font-size: 16px;
            }
            .chart-container {
                min-height: 250px;
            }
        }
    </style>
</head>

            ];

            // ==================== 工具函数 ====================
            function parseNum(val) {
                if (val === null || val === undefined || val === '' || val === '\t') return null;
                if (typeof val === 'number') return val;
                const str = String(val).replace(/,/g, '').trim();
                if (str === '' || str === '-' || str === '—') return null;
                const n = parseFloat(str);
                return isNaN(n) ? null : n;
            }

            function formatLargeNum(n) {
                if (n === null || n === undefined) return '-';
                if (n >= 10000) {
                    return (n / 10000).toFixed(n >= 100000 ? 1 : 2) + '万';
                }
                if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
                return n.toLocaleString();
            }

            function formatAxisLabel(value) {
                if (value >= 10000) {
                    return (value / 10000).toFixed(value >= 100000 ? 1 : 2) + '万';
                }
                if (value >= 1000) return (value / 1000).toFixed(1) + 'K';
                return value;
            }

            // 生成月份列表
            function generateMonths(startYear, startMonth, endYear, endMonth) {
                const months = [];
                let y = startYear,
                    m = startMonth;
                while (y < endYear || (y === endYear && m <= endMonth)) {
                    months.push(y + '-' + String(m).padStart(2, '0'));
                    m++;
                    if (m > 12) { m = 1;
                        y++; }
                }
                return months;

            // ==================== 主逻辑 ====================
            function getChartId() {
                const params = new URLSearchParams(window.location.search);
                const idStr = params.get('id');
                if (idStr === null || idStr === '') return 1;
                const id = parseInt(idStr, 10);
                if (isNaN(id) || id < 1 || id > 20) return 1;
                return id;
            }

            function initChart() {
                const chartId = getChartId();
                const titleEl = document.getElementById('chartTitle');
                const containerEl = document.getElementById('singleChart');

                // 设置标题
                titleEl.textContent = chartTitles[chartId - 1] || '图表 ' + chartId;

                // 销毁旧图表
                const existingInstance = echarts.getInstanceByDom(containerEl);
                if (existingInstance) {
                    existingInstance.dispose();
                }

                // 初始化新图表
                const chart = echarts.init(containerEl, null, {
                    renderer: 'canvas',
                });

                const option = chartOpts[chartId - 1];
                if (option) {
                    chart.setOption(option);
                }

                // 延迟resize
                setTimeout(function() {
                    chart.resize();
                }, 100);

                // 监听resize
                window.addEventListener('resize', function() {
                    if (chart && !chart.isDisposed()) {
                        chart.resize();
                    }
                });

                return chart;
            }

            // 启动
            let currentChart = initChart();

            // 监听URL变化（用于SPA场景）
            let lastUrl = window.location.href;
            const checkUrlChange = function() {
                if (window.location.href !== lastUrl) {
                    lastUrl = window.location.href;
                    if (currentChart && !currentChart.isDisposed()) {
                        currentChart.dispose();
                    }
                    currentChart = initChart();
                }
            };
            setInterval(checkUrlChange, 300);
            window.addEventListener('popstate', function() {
                setTimeout(function() {
                    if (currentChart && !currentChart.isDisposed()) {
                        currentChart.dispose();
                    }
                    currentChart = initChart();
                }, 50);
            });
