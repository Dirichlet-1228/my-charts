<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关键词趋势</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            margin: 0;
            background: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background: transparent;
        }
        .chart-title {
            flex-shrink: 0;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 16px 0 12px;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            min-height: 300px;
            background: transparent;
        }
        @media (max-width: 768px) {
            .chart-title {
                font-size: 16px;
            }
            .chart-container {
                min-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="chart-title" id="chartTitle">加载中...</div>
        <div class="chart-container" id="singleChart"></div>
    </div>

    <script>
        (function() {
            // ==================== 配色数组 ====================
            const COLORS = [
                '#FF9D19', '#4682EB', '#52C41A', '#F5222D', '#FAAD14', '#0FC6C2', '#722ED1', '#EB2F96',
                '#13C2C2', '#7CB305', '#B37FEB', '#FF6B35', '#4080FF', '#FFBBA8', '#95DE64', '#FF7875'
            ];

            // ==================== 工具函数 ====================
            function parseNum(val) {
                if (val === null || val === undefined || val === '' || val === '\t') return null;
                if (typeof val === 'number') return val;
                const str = String(val).replace(/,/g, '').trim();
                if (str === '' || str === '-' || str === '—') return null;
                const n = parseFloat(str);
                return isNaN(n) ? null : n;
            }

            function formatAxisLabel(value) {
                if (value === null || value === undefined) return '';
                if (value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
                if (value >= 10000) return (value / 10000).toFixed(value >= 100000 ? 1 : 2) + '万';
                if (value >= 1000) return (value / 1000).toFixed(1) + 'K';
                return value;
            }

            // ==================== 生成月份列表 ====================
            function generateMonths(startYear, startMonth, endYear, endMonth) {
                const months = [];
                let y = startYear,
                    m = startMonth;
                while (y < endYear || (y === endYear && m <= endMonth)) {
                    months.push(y + '-' + String(m).padStart(2, '0'));
                    m++;
                    if (m > 12) { m = 1;
                        y++; }
                }
                return months;
            }

            const ALL_MONTHS = generateMonths(2022, 1, 2026, 7);

            // ==================== 原始数据映射 ====================
            const rawDataMap = {};

            // tin can phone
            rawDataMap['tin can phone'] = {
                '2026-07': { abaRank: 116435, searchVolume: 15039 },
                '2026-06': { abaRank: 91183, searchVolume: 18278 },
                '2026-05': { abaRank: 117151, searchVolume: 14401 },
                '2026-04': { abaRank: 95564, searchVolume: 18171 },
                '2026-03': { abaRank: 140091, searchVolume: 12482 },
                '2026-02': { abaRank: 128374, searchVolume: 13386 },
                '2026-01': { abaRank: 134332, searchVolume: 13637 },
                '2025-12': { abaRank: 170857, searchVolume: 9493 },
                '2025-11': { abaRank: 266301, searchVolume: 5775 },
                '2025-10': { abaRank: 387376, searchVolume: 3797 },
                '2025-09': { abaRank: 271341, searchVolume: 5797 },
            };
            for (let y = 2022; y <= 2023; y++) {
                const endM = (y === 2023) ? 7 : 12;
                for (let m = 1; m <= endM; m++) {
                    const key = y + '-' + String(m).padStart(2, '0');
                    if (!rawDataMap['tin can phone'][key]) {
                        rawDataMap['tin can phone'][key] = { abaRank: 0, searchVolume: 0 };
                    }
                }
            }

            // landline phones for kids
            rawDataMap['landline phones for kids'] = {
                '2026-07': { abaRank: 441824, searchVolume: 3169 },
                '2026-06': { abaRank: 501120, searchVolume: 2932 },
                '2026-05': { abaRank: 552917, searchVolume: 2591 },
                '2026-04': { abaRank: 480100, searchVolume: 2900 },
                '2026-03': { abaRank: 448385, searchVolume: 3221 },
                '2026-02': { abaRank: 486644, searchVolume: 3006 },
                '2026-01': { abaRank: 289787, searchVolume: 5261 },
                '2025-12': { abaRank: 481327, searchVolume: 2927 },
                '2025-11': { abaRank: 507911, searchVolume: 2891 },
                '2025-10': { abaRank: 534397, searchVolume: 2666 },
                '2025-09': { abaRank: 462785, searchVolume: 3026 },
                '2025-07': { abaRank: 2094838, searchVolume: 469 },
            };
            for (let y = 2022; y <= 2023; y++) {
                const endM = (y === 2023) ? 7 : 12;
                for (let m = 1; m <= endM; m++) {
                    const key = y + '-' + String(m).padStart(2, '0');
                    if (!rawDataMap['landline phones for kids'][key]) {
                        rawDataMap['landline phones for kids'][key] = { abaRank: null, searchVolume: 0 };
                    }
                }
            }

            // kids phone
            rawDataMap['kids phone'] = {
                '2026-07': { abaRank: 25340, searchVolume: 53048 },
                '2026-06': { abaRank: 30877, searchVolume: 45764 },
                '2026-05': { abaRank: 32424, searchVolume: 44020 },
                '2026-04': { abaRank: 31009, searchVolume: 45023 },
                '2026-03': { abaRank: 24745, searchVolume: 54277 },
                '2026-02': { abaRank: 22427, searchVolume: 57849 },
                '2026-01': { abaRank: 19072, searchVolume: 65355 },
                '2025-12': { abaRank: 9009, searchVolume: 112702 },
                '2025-11': { abaRank: 3797, searchVolume: 174097 },
                '2025-10': { abaRank: 18636, searchVolume: 65969 },
                '2025-09': { abaRank: 18558, searchVolume: 65619 },
                '2025-08': { abaRank: 18668, searchVolume: 65151 },
                '2025-07': { abaRank: 19903, searchVolume: 63416 },
                '2025-06': { abaRank: 22134, searchVolume: 57695 },
                '2025-05': { abaRank: 23996, searchVolume: 55036 },
                '2025-04': { abaRank: 23385, searchVolume: 56339 },
                '2025-03': { abaRank: 16836, searchVolume: 70247 },
                '2025-02': { abaRank: 18383, searchVolume: 66380 },
                '2025-01': { abaRank: 21658, searchVolume: 58718 },
                '2024-12': { abaRank: 9097, searchVolume: 101298 },
                '2024-11': { abaRank: 10278, searchVolume: 93971 },
                '2024-10': { abaRank: 21903, searchVolume: 64137 },
                '2024-09': { abaRank: 25642, searchVolume: 58022 },
                '2024-08': { abaRank: 31726, searchVolume: 49017 },
                '2024-07': { abaRank: 28352, searchVolume: 54091 },
                '2024-06': { abaRank: 33016, searchVolume: 47457 },
                '2024-05': { abaRank: 37740, searchVolume: 42514 },
                '2024-04': { abaRank: 39362, searchVolume: 40917 },
                '2024-03': { abaRank: 39093, searchVolume: 41581 },
                '2024-02': { abaRank: 42755, searchVolume: 34859 },
                '2024-01': { abaRank: 38214, searchVolume: 37389 },
                '2023-12': { abaRank: 17123, searchVolume: 71022 },
                '2023-11': { abaRank: 16926, searchVolume: 70229 },
                '2023-10': { abaRank: 23957, searchVolume: 54667 },
                '2023-09': { abaRank: 19895, searchVolume: 62840 },
                '2023-08': { abaRank: 43923, searchVolume: 33273 },
                '2023-07': { abaRank: 41041, searchVolume: 19100 },
                '2023-06': { abaRank: 42977, searchVolume: 19577 },
                '2023-05': { abaRank: 52007, searchVolume: 15734 },
                '2023-04': { abaRank: 52864, searchVolume: 16571 },
                '2023-03': { abaRank: 58522, searchVolume: 14561 },
                '2023-02': { abaRank: 52514, searchVolume: 16407 },
                '2023-01': { abaRank: 53185, searchVolume: 16448 },
                '2022-12': { abaRank: 30194, searchVolume: 26497 },
                '2022-11': { abaRank: 28801, searchVolume: 26864 },
                '2022-10': { abaRank: 51847, searchVolume: 15757 },
                '2022-09': { abaRank: 44172, searchVolume: 18534 },
                '2022-08': { abaRank: 45652, searchVolume: 18216 },
                '2022-07': { abaRank: 53204, searchVolume: 15078 },
                '2022-06': { abaRank: 55199, searchVolume: 16156 },
                '2022-05': { abaRank: 57487, searchVolume: 14772 },
                '2022-04': { abaRank: 64677, searchVolume: 14807 },
                '2022-03': { abaRank: 51727, searchVolume: 16163 },
                '2022-02': { abaRank: 65509, searchVolume: 14233 },
                '2022-01': { abaRank: 73075, searchVolume: 13740 },
            };

            // ==================== 构建系列数据 ====================
            const seriesNames = ['tin can phone', 'landline phones for kids', 'kids phone'];

            function buildSeriesData(field) {
                return seriesNames.map(name => {
                    return ALL_MONTHS.map(m => {
                        const entry = rawDataMap[name] && rawDataMap[name][m];
                        if (!entry) return null;
                        if (field === 'abaRank') {
                            const rank = entry.abaRank;
                            if (rank === null || rank === undefined || rank === '') return null;
                            const num = parseNum(rank);
                            return (num === null || num === 0) ? null : num;
                        }
                        return entry.searchVolume;
                    });
                });
            }

            const searchVolumeSeries = buildSeriesData('searchVolume');
            const abaRankSeries = buildSeriesData('abaRank');

            // ==================== 图表配置生成函数 ====================
            function createLineChartOption(config) {
                const {
                    yAxisName,
                    yAxisFormatter,
                    tooltipValueFormatter,
                    seriesData,
                    seriesNames,
                    inverseY = false,
                } = config;

                const numSeries = seriesNames.length;
                const selectedLegend = {};
                if (numSeries > 3) {
                    seriesNames.forEach((name, i) => {
                        selectedLegend[name] = i < 3;
                    });
                }

                return {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(0,0,0,0.7)',
                        borderColor: 'transparent',
                        textStyle: { color: '#fff', fontSize: 13 },
                        formatter: function(params) {
                            let s = params[0].axisValue + '<br/>';
                            params.forEach(p => {
                                s +=
                                    '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' +
                                    p.color + ';margin-right:6px;"></span>';
                                s += p.seriesName + ': ';
                                s += tooltipValueFormatter(p.value);
                                s += '<br/>';
                            });
                            return s;
                        },
                    },
                    legend: {
                        top: 6,
                        left: 'center',
                        itemWidth: 16,
                        itemHeight: 10,
                        itemGap: 20,
                        textStyle: { fontSize: 12, color: '#333' },
                        data: seriesNames,
                        selected: Object.keys(selectedLegend).length > 0 ? selectedLegend : undefined,
                    },
                    grid: { left: '10%', right: '8%', top: '14%', bottom: '10%' },
                    xAxis: {
                        type: 'category',
                        boundaryGap: false,
                        data: ALL_MONTHS,
                        axisLine: { lineStyle: { color: '#ccc' } },
                        axisTick: { show: false },
                        axisLabel: {
                            rotate: 60,
                            fontSize: 10,
                            color: '#666',
                            interval: Math.floor(ALL_MONTHS.length / 16),
                        },
                        splitLine: { show: false },
                    },
                    yAxis: {
                        type: 'value',
                        name: yAxisName,
                        nameTextStyle: { fontSize: 11, color: '#666' },
                        inverse: inverseY,
                        axisLabel: {
                            fontSize: 11,
                            color: '#666',
                            formatter: yAxisFormatter,
                        },
                        splitLine: { lineStyle: { color: '#E9ECEF', type: 'dashed' } },
                        axisLine: { show: false },
                        axisTick: { show: false },
                    },
                    color: COLORS,
                    series: seriesNames.map((name, i) => ({
                        name: name,
                        type: 'line',
                        data: seriesData[i],
                        connectNulls: false,
                        smooth: false,
                        symbol: 'none',
                        lineStyle: { width: 2 },
                        emphasis: { focus: 'series' },
                    })),
                };
            }

            // 搜索量趋势图表配置
            const searchVolumeOption = createLineChartOption({
                yAxisName: '月搜索量',
                yAxisFormatter: formatAxisLabel,
                tooltipValueFormatter: function(val) {
                    return (val === null || val === undefined) ? '-' : val.toLocaleString();
                },
                seriesData: searchVolumeSeries,
                seriesNames: seriesNames,
                inverseY: false,
            });

            // ABA排名趋势图表配置
            const abaRankOption = createLineChartOption({
                yAxisName: 'ABA排名',
                yAxisFormatter: function(val) {
                    return (val === null || val === undefined) ? '' : val.toLocaleString();
                },
                tooltipValueFormatter: function(val) {
                    return (val === null || val === undefined) ? '-' : val.toLocaleString();
                },
                seriesData: abaRankSeries,
                seriesNames: seriesNames,
                inverseY: true,
            });

            // ==================== 根据URL参数渲染对应图表 ====================
            function getChartId() {
                const params = new URLSearchParams(window.location.search);
                const idStr = params.get('id');
                if (idStr === null || idStr === '') return 1;
                const id = parseInt(idStr, 10);
                return (id === 1 || id === 2) ? id : 1;
            }

            const chartId = getChartId();
            const titleEl = document.getElementById('chartTitle');
            const containerEl = document.getElementById('singleChart');

            // 设置标题
            titleEl.textContent = chartId === 1 ? '关键词搜索量趋势' : '关键词ABA排名趋势';

            // 选择对应的图表配置
            const option = chartId === 1 ? searchVolumeOption : abaRankOption;

            // 销毁可能存在的旧图表实例
            const existingInstance = echarts.getInstanceByDom(containerEl);
            if (existingInstance) {
                existingInstance.dispose();
            }

            // 初始化新图表
            const chart = echarts.init(containerEl, null, { renderer: 'canvas' });
            chart.setOption(option);

            // 延迟 resize 确保正确渲染
            setTimeout(function() {
                chart.resize();
            }, 100);

            // 监听窗口大小变化
            window.addEventListener('resize', function() {
                if (chart && !chart.isDisposed()) {
                    chart.resize();
                }
            });

            console.log('✅ 当前显示图表ID: ' + chartId + ' | 标题: ' + titleEl.textContent);
        })();
    </script>
</body>
</html>
