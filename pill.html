                if (typeof v === 'number') return v;
                if (typeof v === 'string') {
                    return parseFloat(v.replace(/,/g, '')) || 0;

                return 0;

            // ============ 图19: 分款评分星级分布-堆积柱状图 ============
            function getOpt19() {
                const stars = ['三星半及以下', '四星', '四星半', '五星'];

                    [1, 4, 1, 0],
                    [4, 6, 0, 3],
                    [3, 5, 5, 0]
                ];
                const seriesArr = seriesNames.map((name, idx) => ({
                    name: name,
                    type: 'bar',
                    stack: 'total',
                    data: dataMap[idx],
                    itemStyle: { color: COLORS[idx % COLORS.length] },
                    barMaxWidth: 22
                }));
                return {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(0,0,0,0.7)',
                        textStyle: { color: '#fff' }
                    },
                    legend: {
                        top: 0,
                        data: seriesNames,
                        textStyle: { fontSize: 10, color: '#333' },
                        itemWidth: 14,
                        itemHeight: 10,
                        itemGap: 6
                    },
                    grid: { left: 55, right: 20, top: 50, bottom: 30 },
                    xAxis: {
                        type: 'category',
                        data: stars,
                        axisLabel: { fontSize: 11, color: '#666' },

            function getOpt20() {
                const rawData = [
                    { score: 3.2, sales: 58 }, { score: 3.3, sales: 56 }, { score: 3.4, sales: 37 },
                    { score: 3.5, sales: 188 }, { score: 3.6, sales: 53 }, { score: 3.7, sales: 56 },
                    { score: 3.8, sales: 401 }, { score: 3.9, sales: 617 }, { score: 4, sales: 1491 },
                    { score: 4.1, sales: 1745 }, { score: 4.2, sales: 1433 }, { score: 4.3, sales: 688 },
                    { score: 4.4, sales: 494 }, { score: 4.5, sales: 393 }, { score: 4.6, sales: 2362 },
                    { score: 4.7, sales: 72 }, { score: 5, sales: 25 }
                ];
                const xData = rawData.map(d => d.score.toString());
                return {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(0,0,0,0.7)',
                        textStyle: { color: '#fff' },
                        formatter: function(params) {
                            const p = params[0];
                            return '评分: ' + p.axisValue + '<br/>' + p.marker + ' 月销量: ' + parseNum(p.value)
                                .toLocaleString();
                        }
                    },
                    legend: {
                        top: 0,
                        data: ['月销量'],
                        textStyle: { fontSize: 12, color: '#333' },
                        itemWidth: 18,
                        itemHeight: 10
                    },
                    grid: { left: 60, right: 30, top: 45, bottom: 30 },
                    xAxis: {
                        type: 'category',
                        data: xData,
                        name: '评分',
                        axisLabel: { fontSize: 10, color: '#666' },
                        splitLine: { show: false }
                    },
                    yAxis: {
                        type: 'value',
                        name: '月销量',
                        axisLabel: { formatter: formatLargeNum, fontSize: 10, color: '#666' },
                        splitLine: { lineStyle: { color: '#E9ECEF', type: 'dashed' } }
                    },
                    series: [{
                        name: '月销量',
                        type: 'line',
                        data: rawData.map(d => d.sales),
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 6,
                        lineStyle: { width: 2.5, color: COLORS[0] },
                        itemStyle: { color: COLORS[0] },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(255,157,25,0.25)' },
                                { offset: 1, color: 'rgba(255,157,25,0.02)' }
                            ])
                        }
                    }]
                };
            }

            // 图表配置映射
            const chartOpts = [
                getOpt1, getOpt2, getOpt3, getOpt4, getOpt5, getOpt6, getOpt7, getOpt8, getOpt9, getOpt10,
                getOpt11, getOpt12, getOpt13, getOpt14, getOpt15, getOpt16, getOpt17, getOpt18, getOpt19, getOpt20
            ];

            function init() {
                const params = new URLSearchParams(window.location.search);
                let id = parseInt(params.get('id')) || 1;
                if (id < 1 || id > 20) id = 1;
                const idx = id - 1;

                document.getElementById('chartTitle').textContent = chartTitles[idx];
                const container = document.getElementById('singleChart');
                const chart = echarts.init(container);

                const option = chartOpts[idx]();
                chart.setOption(option);

                setTimeout(() => { chart.resize(); }, 100);

                window.addEventListener('resize', () => { chart.resize(); });
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
