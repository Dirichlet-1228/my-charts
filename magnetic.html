            function parseNumber(val) {
                if (val === null || val === undefined) return null;
                if (typeof val === 'number') return val;

                if (str === '' || str === '-' || str === '0') return 0;
                var num = parseFloat(str);
                return isNaN(num) ? null : num;

                if (val === null || val === undefined) return '-';
                if (val >= 10000) {
                    return (val / 10000).toFixed(1) + '万';
                }
                return String(val);
            }

            function formatCurrency(val) {
                if (val === null || val === undefined) return '-';
                if (val >= 10000) {
                    return '$' + (val / 10000).toFixed(1) + '万';
                }
                return '$' + val.toFixed(2);

            // 构建时间序列 (从旧到新)
            function buildTimeSeries(startYear, startMonth, endYear, endMonth) {
                var result = [];
                var y = startYear;
                var m = startMonth;
                while (y < endYear || (y === endYear && m <= endMonth)) {
                    result.push(y + '-' + String(m).padStart(2, '0'));
                    m++;
                    if (m > 12) {
                        m = 1;
                        y++;
                    }
                }
                return result;
            }

            function mapDataByTime(records, timeSeries, keyName) {
                var map = {};

                    var rec = records[i];
                    map[rec.month] = rec[keyName];
                }
                return timeSeries.map(function(t) {
                    return (t in map) ? parseNumber(map[t]) : null;

                        itemStyle: { color: COLORS[4] } }
                ]
            };

            // ---- 图16: 无数据占位 ----
            chartOpts[15] = {
                title: { text: '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#bbb', fontSize: 18 } },
                xAxis: { show: false },
                yAxis: { show: false },
                series: []
            };
            // ---- 图17: 无数据占位 ----
            chartOpts[16] = {
                title: { text: '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#bbb', fontSize: 18 } },
                xAxis: { show: false },
                yAxis: { show: false },
                series: []
            };
            // ---- 图18: 无数据占位 ----
            chartOpts[17] = {
                title: { text: '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#bbb', fontSize: 18 } },
                xAxis: { show: false },
                yAxis: { show: false },
                series: []
            };

            // ---- 图19: 分款星级分布-堆积柱状图 ----
            chartOpts[18] = {
                color: COLORS,
                tooltip: baseTooltip('axis'),
                legend: baseLegend('horizontal', 10, 0),
                grid: { left: 50, right: 30, top: 45, bottom: 55, containLabel: true },
                xAxis: baseXAxis(starCats, {}),
                yAxis: baseYAxis({ formatter: null }),
                series: [
                    { name: '杆球堡垒搭建套装', type: 'bar', stack: 'total', data: starDist1, barWidth: '50%',
                        itemStyle: { color: COLORS[0] } },
                    { name: '毯子堡垒搭建套装', type: 'bar', stack: 'total', data: starDist2, barWidth: '50%',
                        itemStyle: { color: COLORS[1] } },
                    { name: '磁力堡垒搭建板', type: 'bar', stack: 'total', data: starDist3, barWidth: '50%',
                        itemStyle: { color: COLORS[2] } },
                    { name: '纸板堡垒搭建套装', type: 'bar', stack: 'total', data: starDist4, barWidth: '50%',
                        itemStyle: { color: COLORS[3] } },
                    { name: '塑料结构堡垒套装', type: 'bar', stack: 'total', data: starDist5, barWidth: '50%',
                        itemStyle: { color: COLORS[4] } }
                ]
            };

            // ---- 图20: 无数据占位 ----
            chartOpts[19] = {
                title: { text: '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#bbb', fontSize: 18 } },
                xAxis: { show: false },
                yAxis: { show: false },
                series: []
            };

            // ========== URL参数解析 & 渲染 ==========
            var urlParams = new URLSearchParams(window.location.search);
            var rawId = urlParams.get('id');
            var chartId = parseInt(rawId, 10);
            if (isNaN(chartId) || chartId < 1 || chartId > 20) {
                chartId = 1;
            }

            var titleEl = document.getElementById('chartTitle');
            var chartEl = document.getElementById('singleChart');

            titleEl.textContent = chartTitles[chartId - 1] || ('图表' + chartId);

            var myChart = echarts.init(chartEl);
            var opts = chartOpts[chartId - 1] || chartOpts[0];
            myChart.setOption(opts, true);

            // 延迟100ms调用resize
            setTimeout(function() {
                myChart.resize();
            }, 100);

            // 响应式
            window.addEventListener('resize', function() {
                if (myChart) {
                    myChart.resize();
                }
            });
        })();
    </script>
