                return dataMap;
            }

            const dataMap = parseRawData();

            // 生成完整月份序列（2017-01 至 2026-04）
            function generateMonths() {
                const months = [];
                for (let y = 2017; y <= 2026; y++) {
                    const endM = (y === 2026) ? 4 : 12;
                    for (let m = 1; m <= endM; m++) {
                        months.push(y + '-' + (m < 10 ? '0' + m : m));
                    }
                }
                return months;
            }
            const allMonths = generateMonths();

            // 提取三个关键词的系列数据
            function buildSeries(key, field) {
                return allMonths.map(m => {
                    const entry = dataMap[key] && dataMap[key][m];
                    if (!entry) return null;
                    const val = entry[field];
                    return (val !== null && val !== undefined) ? val : null;
                });
            }

            const volumeSeriesArr = [
                { name: 'bible verse jar', data: buildSeries('bible verse jar', 'volume') },
                { name: 'christian gifts for women', data: buildSeries('christian gifts for women', 'volume') },
                { name: 'bible verse bracelets', data: buildSeries('bible verse bracelets', 'volume') }
            ];

            const rankSeriesArr = [
                { name: 'bible verse jar', data: buildSeries('bible verse jar', 'rank') },
                { name: 'christian gifts for women', data: buildSeries('christian gifts for women', 'rank') },
                { name: 'bible verse bracelets', data: buildSeries('bible verse bracelets', 'rank') }
            ];

            // ========== 图表配置数组 (ID 1 和 ID 2) ==========
            const chartOpts = [];

            // 图1：月搜索量趋势
            chartOpts.push(getLineOpt(allMonths, volumeSeriesArr, '关键词月搜索量趋势', {
                yAxisFormatter: v => fmtKBM(v),
                yAxisName: '月搜索量',
                xRotate: 45,
                xInterval: 4,
                smooth: true,
                tooltipFormatter: function(params) {
                    let s = '<strong>' + params[0].axisValue + '</strong><br/>';
                    params.forEach(p => {
                        const val = p.value !== null ? p.value.toLocaleString() : '无数据';
                        s += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' +
                            p.color + ';margin-right:6px;"></span>' +
                            p.seriesName + ': ' + val + '<br/>';
                    });
                    return s;
                }
            }));

            // 图2：ABA排名趋势（倒置Y轴）
            chartOpts.push(getLineOpt(allMonths, rankSeriesArr, '关键词ABA排名趋势（倒置）', {
                yAxisFormatter: v => {
                    if (v >= 1000000) return (v / 1000000).toFixed(1) + 'M';
                    if (v >= 1000) return (v / 1000).toFixed(1) + 'K';
                    return v;
                },
                yAxisName: 'ABA排名 (越小越热 ↑)',
                yAxisInverse: true,
                xRotate: 45,
                xInterval: 4,
                smooth: true,
                tooltipFormatter: function(params) {
                    let s = '<strong>' + params[0].axisValue + '</strong><br/>';
                    params.forEach(p => {
                        const val = p.value !== null ? p.value.toLocaleString() : '无数据';
                        s += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' +
                            p.color + ';margin-right:6px;"></span>' +
                            p.seriesName + ': ' + val + '<br/>';
                    });
                    return s;
                }
            }));

            // ========== 初始化渲染 (根据URL参数id切换) ==========
            function init() {
                const params = new URLSearchParams(window.location.search);
                let id = parseInt(params.get('id')) || 1;
                if (id < 1 || id > 2 || isNaN(id)) id = 1;

                const titles = ['关键词月搜索量趋势', '关键词ABA排名趋势（倒置）'];
                document.getElementById('chartTitle').textContent = titles[id - 1];

                const container = document.getElementById('singleChart');
                if (container._echart_instance) {
                    container._echart_instance.dispose();
                }
                const chart = echarts.init(container);
                container._echart_instance = chart;

                const option = chartOpts[id - 1];
                if (option) chart.setOption(option);

                setTimeout(() => chart.resize(), 80);
                window.addEventListener('resize', () => chart.resize());
            }

            document.addEventListener('DOMContentLoaded', init);
            if (document.readyState === 'complete' || document.readyState === 'interactive') init();
        })();
    </script>
</body>
</html>
