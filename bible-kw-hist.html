            margin: 0;

        }
        html,

            height: 100%;
            margin: 0;
            background: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .chart-title {
            flex-shrink: 0;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 16px 0 12px;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }
        @media (max-width:768px) {
            .chart-title {
                font-size: 16px;
            }
            .chart-container {
                min-height: 250px;
            }
        }
    </style>

            // ==================== 工具函数 ====================
            function parseNum(val) {
                if (val === null || val === undefined || val === '') return null;
                if (typeof val === 'number') return val;
                return parseInt(String(val).replace(/,/g, ''), 10);
            }

            function formatWan(val) {
                if (val === null || val === undefined || val === '') return '';
                var n = parseNum(val);
                if (isNaN(n)) return '';
                if (n >= 10000) {
                    return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
                }
                return n.toLocaleString();
            }

            function formatKMBrief(val) {
                if (val === null || val === undefined || val === '') return '';
                var n = parseNum(val);
                if (isNaN(n)) return '';
                if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
                if (n >= 10000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
                return n.toLocaleString();
            }

            // ==================== 初始化渲染 ====================
            function renderChart() {
                const params = new URLSearchParams(window.location.search);
                let chartId = parseInt(params.get('id'), 10);
                if (isNaN(chartId) || chartId < 1 || chartId > 20) {
                    chartId = 1;
                }
                const idx = chartId - 1;
                const titleEl = document.getElementById('chartTitle');
                const containerEl = document.getElementById('singleChart');

                // 设置标题
                const titleText = chartTitles[idx];
                if (titleText) {
                    titleEl.textContent = titleText;
                    titleEl.style.display = '';
                } else {
                    titleEl.style.display = 'none';
                }

                // 销毁旧实例
                if (containerEl._echartInstance) {
                    containerEl._echartInstance.dispose();
                }

                const chart = echarts.init(containerEl);
                containerEl._echartInstance = chart;
                chart.setOption(chartOpts[idx]);

                // 延时resize
                setTimeout(function() {
                    chart.resize();
                }, 100);
            }

            // 监听resize
            window.addEventListener('resize', function() {
                const containerEl = document.getElementById('singleChart');
                if (containerEl && containerEl._echartInstance) {
                    containerEl._echartInstance.resize();
                }
            });

            // 初始渲染

            // 监听URL变化（hashchange + popstate）

            // 也监听hashchange

            });
