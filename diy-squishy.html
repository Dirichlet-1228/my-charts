        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,

            height: 100%;
            margin: 0;
            background: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .chart-title {
            flex-shrink: 0;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 16px 0 12px;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }
        @media (max-width:768px) {
            .chart-title {
                font-size: 16px;
            }
            .chart-container {
                min-height: 250px;
            }
        }
    </style>

            // ============ 初始化逻辑 ============
            function initChart() {
                const params = new URLSearchParams(window.location.search);
                let chartId = parseInt(params.get('id'));
                if (isNaN(chartId) || chartId < 1 || chartId > 20) {
                    chartId = 1;
                }
                const idx = chartId - 1;
                const titleEl = document.getElementById('chartTitle');
                titleEl.textContent = chartTitles[idx] || '图表';
                const container = document.getElementById('singleChart');
                // 销毁旧实例
                if (container._echartInstance) {
                    container._echartInstance.dispose();
                }
                const chart = echarts.init(container, null, { renderer: 'canvas' });
                container._echartInstance = chart;
                const opt = chartOpts[idx];
                if (opt) {
                    // 深拷贝避免污染原始配置
                    chart.setOption(JSON.parse(JSON.stringify(opt)));
                }
                setTimeout(() => {
                    chart.resize();
                }, 100);
            }

            window.addEventListener('resize', function() {
                const container = document.getElementById('singleChart');
                if (container && container._echartInstance) {
                    container._echartInstance.resize();
                }
            });

            // 启动
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initChart);
            } else {
                initChart();
            }
