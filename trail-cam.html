                    { brand:'Bushnell', monthlySales:45, price:113.94, rating:4.0, rank:108, type:'老品' },
                    { brand:'Browning', monthlySales:42, price:119.00, rating:4.1, rank:109, type:'老品' },
                    { brand:'BLAZEVIDEO', monthlySales:39, price:129.99, rating:4.4, rank:110, type:'老品' },
                    { brand:'Wildgame Innovations', monthlySales:40, price:44.64, rating:3.6, rank:111, type:'老品' },
                    { brand:'Wildgame Innovations', monthlySales:37, price:89.99, rating:3.6, rank:112, type:'老品' },
                    { brand:'MUDDY', monthlySales:36, price:53.92, rating:4.3, rank:113, type:'老品' },
                    { brand:'Moultrie', monthlySales:36, price:109.90, rating:3.7, rank:114, type:'老品' },
                    { brand:'SPYPOINT', monthlySales:36, price:127.99, rating:3.8, rank:115, type:'老品' },
                    { brand:'Moultrie', monthlySales:34, price:85.00, rating:4.3, rank:116, type:'老品' },
                    { brand:'Stealth Cam', monthlySales:33, price:31.62, rating:3.9, rank:117, type:'老品' },
                    { brand:'Stealth Cam', monthlySales:31, price:39.99, rating:4.2, rank:118, type:'老品' },
                    { brand:'MUDDY', monthlySales:30, price:45.00, rating:4.0, rank:119, type:'老品' },
                    { brand:'TACTACAM', monthlySales:30, price:99.99, rating:4.6, rank:120, type:'老品' }
                ];
                rawData.sort((a,b)=>a.rank-b.rank);
                const xData = rawData.map(d=>d.rank);
                const newColor = COLORS[0]; // #FF9D19 主色优先给新品
                const oldColor = COLORS[1]; // #4682EB
                const newSeriesData = rawData.map(d=>{
                    if(d.type==='新品') return { value:d.monthlySales, _brand:d.brand, _price:d.price, _rating:d.rating, _rank:d.rank, _type:d.type };
                    return null;
                });
                const oldSeriesData = rawData.map(d=>{
                    if(d.type==='老品') return { value:d.monthlySales, _brand:d.brand, _price:d.price, _rating:d.rating, _rank:d.rank, _type:d.type };
                    return null;
                });
                const option = {
                    tooltip: {
                        trigger:'axis',
                        backgroundColor:'rgba(0,0,0,0.7)',
                        borderColor:'transparent',
                        textStyle:{ color:'#fff', fontSize:12 },
                        axisPointer:{ type:'shadow' },
                        formatter: function(params){
                            var p = params[0];
                            if(!p || !p.data) return '';
                            var d = p.data;
                            var typeColor = d._type==='新品' ? newColor : oldColor;
                            return `<div style="min-width:180px;">
                                <div style="font-size:15px;font-weight:700;color:#fff;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.2);padding-bottom:8px;">🏷️ ${d._brand}</div>
                                <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;line-height:1.8;">
                                    <span style="color:#aaa;">📊 排名</span><span style="font-weight:600;text-align:right;">#${d._rank}</span>
                                    <span style="color:#aaa;">📦 月销量</span><span style="font-weight:600;text-align:right;color:#FF9D19;">${d.value.toLocaleString()}</span>
                                    <span style="color:#aaa;">💲 价格</span><span style="font-weight:600;text-align:right;">$${d._price.toFixed(2)}</span>
                                    <span style="color:#aaa;">⭐ 评分</span><span style="font-weight:600;text-align:right;">${d._rating.toFixed(1)}</span>
                                    <span style="color:#aaa;">🏷️ 类型</span><span style="text-align:right;"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${typeColor};margin-right:6px;"></span><strong>${d._type}</strong></span>
                                </div>
                            </div>`;
                        }
                    },
                    legend: {
                        data:['新品','老品'],
                        right:10,
                        top:0,
                        textStyle:{ fontSize:12, color:'#333' }
                    },
                    grid: { left:60, right:40, top:50, bottom:80 },
                    xAxis: {
                        type:'category',
                        data:xData,
                        name:'排名',
                        nameLocation:'middle',
                        nameGap:48,
                        nameTextStyle:{ fontSize:12, fontWeight:600, color:'#555' },
                        axisLabel:{ fontSize:10, color:'#666', rotate:45, interval:4, margin:10 },
                        axisTick:{ alignWithLabel:true, lineStyle:{ color:'#ddd' } },
                        axisLine:{ lineStyle:{ color:'#ccc' } }
                    },
                    yAxis: {
                        type:'value',
                        name:'月销量',
                        nameTextStyle:{ fontSize:12, fontWeight:600, color:'#555' },
                        axisLabel:{ fontSize:10, color:'#666', formatter:function(v){ return fmtKBM(v); } },
                        splitLine:{ lineStyle:{ color:'#E9ECEF', type:'dashed' } },
                        axisLine:{ show:false }
                    },
                    dataZoom: [
                        { type:'slider', start:0, end:22, height:24, bottom:16, borderColor:'#e0e0e0', backgroundColor:'#fafafa', fillerColor:'rgba(84,112,198,0.12)', handleStyle:{ color:'#5470C6', borderColor:'#5470C6' }, textStyle:{ fontSize:10, color:'#888' }, showDetail:true, showDataShadow:true },
                        { type:'inside', start:0, end:22, zoomOnMouseWheel:true, moveOnMouseMove:true }
                    ],
                    series: [
                        { name:'新品', type:'bar', data:newSeriesData, itemStyle:{ color:newColor, borderRadius:[4,4,0,0], borderWidth:0 }, barWidth:'60%', emphasis:{ focus:'series' } },
                        { name:'老品', type:'bar', data:oldSeriesData, itemStyle:{ color:oldColor, borderRadius:[4,4,0,0], borderWidth:0 }, barWidth:'60%', emphasis:{ focus:'series' } }
                    ]
                };
                chartOpts.push(option);
            })();

            // 初始化渲染
            function init() {
                var params = new URLSearchParams(window.location.search);
                var id = parseInt(params.get('id')) || 1;
                if(id<1 || id>21 || isNaN(id)) id=1;
                document.getElementById('chartTitle').textContent = chartTitles[id-1];
                var container = document.getElementById('singleChart');
                var chart = echarts.init(container);
                var option = chartOpts[id-1];
                if(option) chart.setOption(option);
                setTimeout(function(){ chart.resize(); },100);
                window.addEventListener('resize', function(){ chart.resize(); });
                // 键盘导航（仅对图表21有效）
                if(id===21){
                    function keyHandler(e){
                        if(e.key==='ArrowRight'){
                            var opt = chart.getOption();
                            var dz = opt.dataZoom;
                            if(dz && dz[0]){
                                var start = dz[0].start || 0;
                                var end = dz[0].end || 22;
                                var range = end - start;
                                start = Math.min(100-range, start + range*0.3);
                                end = start + range;
                                chart.dispatchAction({ type:'dataZoom', start:start, end:end });
                            }
                        } else if(e.key==='ArrowLeft'){
                            var opt = chart.getOption();
                            var dz = opt.dataZoom;
                            if(dz && dz[0]){
                                var start = dz[0].start || 0;
                                var end = dz[0].end || 22;
                                var range = end - start;
                                start = Math.max(0, start - range*0.3);
                                end = start + range;
                                chart.dispatchAction({ type:'dataZoom', start:start, end:end });
                            }
                        }
                    }
                    document.addEventListener('keydown', keyHandler);
                    chart._keyHandler = keyHandler; // 存储以便移除
                }
            }
            document.addEventListener('DOMContentLoaded', init);
            if(document.readyState==='complete'||document.readyState==='interactive') init();
        })();
    </script>
</body>
</html>
