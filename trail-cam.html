            function parseNum(v) {
                if (typeof v === 'string') return parseFloat(v.replace(/,/g,'')) || 0;
                if (typeof v === 'number') return v;
                return 0;
            }

            function fmtKBM(v) {
                var n = parseNum(v);
                if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
                if (n >= 10000) return (n / 10000).toFixed(1) + '万';
                if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
                return n.toString();

                opts = opts || {};

                var seriesData = dataPairs.map(function(d, i) {
                    return { name: d[0], value: d[1], itemStyle: { color: COLORS[i % COLORS.length] } };
                });
                var legendData = dataPairs.map(function(d) { return d[0]; });

                    tooltip: {
                        trigger: 'item',
                        backgroundColor: 'rgba(0,0,0,0.7)',
                        borderColor: 'transparent',
                        textStyle: { color: '#fff' },
                        formatter: function(p) {
                            return p.name + '<br/>月销量: ' + p.value.toLocaleString() + '<br/>占比: ' + p.percent + '%';
                        }
                    },
                    legend: showLegend ? {
                        type: 'scroll',
                        orient: 'vertical',
                        right: 10,
                        top: 'middle',
                        itemGap: 8,
                        textStyle: { fontSize: 12, color: '#333' },
                        data: legendData

                    series: [{
                        type: 'pie',
                        radius: ['40%', '68%'],
                        center: showLegend ? ['40%', '50%'] : ['50%', '50%'],
                        avoidLabelOverlap: true,
                        itemStyle: { borderColor: 'transparent', borderWidth: 0 },
                        label: {
                            show: true,
                            position: 'outside',
                            formatter: showLegend ? '{b}\n{d}%' : function(p) {
                                var idx = p.dataIndex;
                                var c = COLORS[idx % COLORS.length];
                                return '{dot' + idx + '|●} {name' + idx + '|' + p.name + '}\n{pc' + idx + '|' + p.percent + '%}';

                            rich: showLegend ? {} : (function() {
                                var r = {};
                                for (var i = 0; i < dataPairs.length; i++) {
                                    r['dot' + i] = { fontSize: 13, color: COLORS[i % COLORS.length], fontWeight: 'bold', padding: [0, 4, 0, 0] };
                                    r['name' + i] = { fontSize: 11, color: '#333', padding: [0, 0, 0, 2] };
                                    r['pc' + i] = { fontSize: 10, color: '#888', padding: [0, 0, 0, 16] };

                        data: seriesData

            }

                if (seriesArr.length > 3) {
                    for (var i = 0; i < seriesArr.length; i++) {
                        legendSelected[seriesArr[i].name] = i < 3;
                    }
                }
                return {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(0,0,0,0.7)',
                        borderColor: 'transparent',
                        textStyle: { color: '#fff' },
                        formatter: opts.tooltipFormatter || null

                    legend: {
                        type: 'scroll',
                        bottom: 0,
                        textStyle: { fontSize: 11, color: '#333' },
                        data: seriesArr.map(function(s) { return s.name; }),
                        selected: legendSelected

                    grid: { left: 50, right: 30, top: 25, bottom: 50 },
                    xAxis: {
                        type: 'category',
                        data: xData,
                        boundaryGap: false,
                        axisLine: { lineStyle: { color: '#ccc' } },
                        axisTick: { show: false },

                        type: 'value',

                if (container._echart_instance) {
                    container._echart_instance.dispose();
                }
                var chart = echarts.init(container);
                container._echart_instance = chart;

                var option = chartOpts[id - 1];

                setTimeout(function() { chart.resize(); }, 100);
                window.addEventListener('resize', function() { chart.resize(); });

                // 键盘导航（仅图21）
                if (id === 21) {
                    function keyHandler(e) {
                        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                            var opt = chart.getOption();
                            var dz = opt.dataZoom;
                            if (dz && dz[0]) {
                                var start = dz[0].start || 0;
                                var end = dz[0].end || 22;
                                var range = end - start;
                                if (e.key === 'ArrowRight') {
                                    start = Math.min(100 - range, start + range * 0.3);
                                } else {
                                    start = Math.max(0, start - range * 0.3);
                                }
                                end = start + range;
                                chart.dispatchAction({ type: 'dataZoom', start: start, end: end });
                            }
                        }
                    }
                    document.addEventListener('keydown', keyHandler);
                    chart._keyHandler = keyHandler;
                }
            }

            document.addEventListener('DOMContentLoaded', init);
            if (document.readyState === 'complete' || document.readyState === 'interactive') init();
