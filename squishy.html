<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据可视化图表</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            margin: 0;
            background: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .chart-title {
            flex-shrink: 0;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 16px 0 12px;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }
        @media (max-width:768px) {
            .chart-title {
                font-size: 16px;
            }
            .chart-container {
                min-height: 250px;
            }
        }
    </style>
</head>

                if (typeof v === 'string') return parseFloat(v.replace(/,/g, '')) || 0;
                if (typeof v === 'number') return v;
                return 0;
            }

            function fmtLarge(n) {
                if (Math.abs(n) >= 10000) return (n / 10000).toFixed(1) + '万';
                return n + '';
            }

            function fmtPrice(n) {
                return '$' + parseFloat(n).toFixed(2);
            }

                if (!showDot) {
                    return '{b}\n{d}%';
                }
                return function(params) {
                    return '{dot|●} ' + params.name + '\n{d}%';
                };
            }

                return rawData.map((item, i) => ({
                    name: item.name,
                    value: parseNum(item.value),
                    itemStyle: { color: COLORS[(colorStart + i) % COLORS.length] },
                    label: {
                        rich: {
                            dot: {
                                color: COLORS[(colorStart + i) % COLORS.length],
                                fontSize: 14,
                                padding: [0, 6, 0, 0],
                                verticalAlign: 'middle'

                let id = parseInt(params.get('id'));
                if (isNaN(id) || id < 1 || id > chartOpts.length) id = 1;
                const idx = id - 1;

                document.getElementById('chartTitle').textContent = chartTitles[idx] || ('图表 ' + id);

                const container = document.getElementById('singleChart');
                const chart = echarts.init(container, null, { renderer: 'canvas' });

                const opt = chartOpts[idx];
                if (opt && !opt.series) opt.series = [];
                chart.setOption(opt || {});
