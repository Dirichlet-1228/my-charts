        }
        body {

        .wrapper {
            display: flex;
            flex-direction: column;

        }
        .chart-title {

            font-size: 18px;

            color: #1a1a2e;

        }
        .chart-container {

        @media (max-width:768px) {
            .chart-title {

                if (v === '' || v === null || v === undefined || v === '\t' || v === '0') return 0;

                return parseFloat(String(v).replace(/,/g, '')) || 0;
