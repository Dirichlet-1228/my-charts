                                    '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' +
                                    p.color + ';margin-right:6px;"></span>';
                                s += p.seriesName + ': ' + (isAmt ? '$' : '') + parseNum(p
                                    .value).toLocaleString() + '<br/>';
                            });
                            return s;
                        },
                    },
                    legend: {
                        type: 'scroll',
                        bottom: 0,
                        data: allNames,
                        selected: selectedObj,
                        itemWidth: 12,
                        itemHeight: 12,
                        textStyle: { fontSize: 10, color: '#333' },
                    },
                    grid: { left: 55, right: 70, top: 20, bottom: 70 },
                    xAxis: {
                        type: 'category',
                        data: priceRanges,
                        axisLabel: { rotate: 30, fontSize: 9 },
                        axisLine: { lineStyle: { color: '#ccc' } },
                        splitLine: { show: false },
                    },
                    yAxis: [{
                        type: 'value',
                        name: '月销量',
                        axisLabel: { formatter: axisLabelFormatter, fontSize: 10 },
                        splitLine: { lineStyle: { color: '#E9ECEF', type: 'dashed' } },
                    }, {
                        type: 'value',
                        name: '月销售额($)',
                        axisLabel: { formatter: function(v) { return '$' + axisLabelFormatter(
                                v); }, fontSize: 10 },
                        splitLine: { show: false },
                    }, ],
                    series: allSeries,
                };
            })();

            // ---------- 图表16：价格-质量联动分析（无数据） ----------
            chartTitles[16] = '价格-质量联动分析';
            chartOpts[16] = (function() {
                return {
                    title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#999',
                            fontSize: 16 } },
                    xAxis: { show: false },
                    yAxis: { show: false },
                    series: [],
                };
            })();

            // ---------- 图表17：品牌价格分布（无数据） ----------
            chartTitles[17] = '品牌价格分布';
            chartOpts[17] = (function() {
                return {
                    title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#999',
                            fontSize: 16 } },
                    xAxis: { show: false },
                    yAxis: { show: false },
                    series: [],
                };
            })();

            // ---------- 图表18：新老品价格分布（无数据） ----------
            chartTitles[18] = '新老品价格分布';
            chartOpts[18] = (function() {
                return {
                    title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#999',
                            fontSize: 16 } },
                    xAxis: { show: false },
                    yAxis: { show: false },
                    series: [],
                };
            })();

            // ---------- 图表19：分款星级分布-堆积柱状图 ----------
            chartTitles[19] = '分款星级分布';
            chartOpts[19] = (function() {
                const xData = ['三星半及以下', '四星', '四星半', '五星'];
                const styleNames = ['手持显微镜', '显微望远二合一', '内窥镜', '光学显微镜', '显微内窥二合一', '手机二合一显微镜'];
                const rawData = [
                    [1, 0, 3, 1, 0, 0],
                    [3, 0, 7, 1, 0, 1],
                    [46, 5, 20, 3, 1, 1],
                    [3, 0, 3, 1, 0, 0],
                ];
                const seriesData = styleNames.map((name, i) => ({
                    name: name,
                    type: 'bar',
                    stack: 'total',
                    data: rawData.map(r => r[i]),
                    itemStyle: { color: COLORS[i] },
                    barWidth: '50%',
                }));
                return {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: tooltipBg,
                        textStyle: { color: '#fff' },
                        formatter: function(params) {
                            let s = params[0].axisValue + '<br/>';
                            params.forEach(p => {
                                s +=
                                    '<span style="display:inline-block;width:10px;height:10px;background:' +
                                    p.color + ';margin-right:6px;"></span>';
                                s += p.seriesName + ': ' + p.value + '<br/>';
                            });
                            return s;
                        },
                    },
                    legend: {
                        type: 'scroll',
                        bottom: 0,
                        data: styleNames,
                        itemWidth: 12,
                        itemHeight: 12,
                        textStyle: { fontSize: 10, color: '#333' },
                    },
                    grid: { left: 50, right: 30, top: 20, bottom: 55 },
                    xAxis: {
                        type: 'category',
                        data: xData,
                        axisLabel: { fontSize: 11 },
                        axisLine: { lineStyle: { color: '#ccc' } },
                        splitLine: { show: false },
                    },
                    yAxis: {
                        type: 'value',
                        name: '数量',
                        axisLabel: { fontSize: 10 },
                        splitLine: { lineStyle: { color: '#E9ECEF', type: 'dashed' } },
                    },
                    series: seriesData,
                };
            })();

            // ---------- 图表20：评分销量趋势-折线图 ----------
            chartTitles[20] = '评分销量趋势';
            chartOpts[20] = (function() {
                const raw = [
                    [3.2, 51],
                    [3.4, 36],
                    [3.5, 30],
                    [3.6, 95],
                    [3.7, 21],
                    [3.8, 35],
                    [3.9, 24],
                    [4.0, 32],
                    [4.1, 66],
                    [4.2, 1805],
                    [4.3, 3428],
                    [4.4, 6565],
                    [4.5, 12940],
                    [4.6, 27671],
                    [4.7, 2622],
                    [4.8, 85],
                    [4.9, 55],
                    [5.0, 244],
                ];
                raw.sort((a, b) => a[0] - b[0]);
                const xData = raw.map(r => r[0].toFixed(1));
                const yData = raw.map(r => r[1]);
                return {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: tooltipBg,
                        textStyle: { color: '#fff' },
                        formatter: function(params) {
                            const p = params[0];
                            return '评分: ' + p.axisValue + '<br/>月销量: ' + parseNum(p.value)
                                .toLocaleString();
                        },
                    },
                    legend: { show: false },
                    grid: { left: 55, right: 30, top: 20, bottom: 40 },
                    xAxis: {
                        type: 'category',
                        data: xData,
                        name: '评分',
                        axisLabel: { fontSize: 10 },
                        axisLine: { lineStyle: { color: '#ccc' } },
                        splitLine: { show: false },
                    },
                    yAxis: {
                        type: 'value',
                        name: '月销量',
                        axisLabel: { formatter: axisLabelFormatter, fontSize: 10 },
                        splitLine: { lineStyle: { color: '#E9ECEF', type: 'dashed' } },
                    },
                    series: [{
                        name: '月销量',
                        type: 'line',
                        data: yData,
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 5,
                        lineStyle: { width: 2, color: COLORS[0] },
                        itemStyle: { color: COLORS[0] },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(255,157,25,0.3)' },
                                { offset: 1, color: 'rgba(255,157,25,0.02)' },
                            ]),
                        },
                    }],
                };
            })();

            // ==================== 初始化逻辑 ====================
            function initChart() {
                const params = new URLSearchParams(window.location.search);
                let chartId = parseInt(params.get('id')) || 1;
                if (chartId < 1 || chartId > 20 || !chartOpts[chartId]) chartId = 1;

                document.getElementById('chartTitle').textContent = chartTitles[chartId] || '';
                const container = document.getElementById('singleChart');
                if (container._echartInstance) {
                    container._echartInstance.dispose();
                }
                const chart = echarts.init(container);
                container._echartInstance = chart;
                const opt = chartOpts[chartId];
                if (opt) chart.setOption(opt, true);
                setTimeout(function() { chart.resize(); }, 100);
            }

            window.addEventListener('resize', function() {
                const container = document.getElementById('singleChart');
                if (container._echartInstance) {
                    container._echartInstance.resize();
                }
            });

            initChart();
        })();
    </script>
</body>
</html>
