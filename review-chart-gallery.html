const D=DATA.datasets;
const UI={ink:'#1a1a2e',muted:'#6c757d',grid:'#E9ECEF'};
const pct=v=>Math.round(Number(v)*1000)/10;
const tooltip={backgroundColor:'rgba(0,0,0,0.7)',borderWidth:0,textStyle:{color:'#fff',fontSize:12}};
const axisTooltip={...tooltip,trigger:'axis',axisPointer:{type:'shadow'}};
const itemTooltip={...tooltip,trigger:'item'};
const axisLabel={color:UI.muted,fontSize:11};
const splitLine={lineStyle:{color:UI.grid,type:'dashed'}};
function axisBase(){return{xAxis:{type:'category',axisLine:{lineStyle:{color:UI.grid}},axisTick:{show:false},axisLabel},yAxis:{type:'value',axisLine:{show:false},axisTick:{show:false},axisLabel,splitLine}}}
function valueBase(){return{xAxis:{type:'value',axisLine:{show:false},axisTick:{show:false},axisLabel,splitLine},yAxis:{type:'category',axisLine:{show:false},axisTick:{show:false},axisLabel}}}
function grid(){return{left:54,right:28,top:48,bottom:42,containLabel:true}}
function hgrid(){return{left:150,right:40,top:38,bottom:34,containLabel:false}}
function ov(i,key){return D[i].overview.find(x=>x[0]===key)?.[1]}
function rows(key,i){return D[i][key]}
function starmap(i){const o={};for(let s=1;s<=5;s++)o[s]=D[i].rating.find(x=>x[1]===s)?.[2]||0;return o}
function relation(i,label){return D[i].rating.find(x=>x[1]===label)||[]}
function hbar(key,i,title){const r=rows(key,i).filter(x=>x[2]>0);return{tooltip:{...axisTooltip,formatter:p=>{const x=r[p.dataIndex];return `${x[1]}<br/>提及：${x[2]}条<br/>占比：${pct(x[3])}%<br/>平均星级：${Number(x[4]).toFixed(2)}`}},grid:hgrid(),...valueBase(),yAxis:{type:'category',data:r.map(x=>x[1]).reverse(),axisLine:{show:false},axisTick:{show:false},axisLabel:{color:UI.ink,fontSize:11}},series:[{type:'bar',data:r.map(x=>x[2]).reverse(),barMaxWidth:18,itemStyle:{color:PALETTE[0]},emphasis:{itemStyle:{color:'#d97706'}}}]}}
function comparisonBar(key,title,maxItems=10){const names=[...new Set(D.flatMap(d=>d[key].map(x=>x[1])))];names.sort((a,b)=>Math.max(...D.map(d=>d[key].find(x=>x[1]===b)?.[2]||0))-Math.max(...D.map(d=>d[key].find(x=>x[1]===a)?.[2]||0)));const use=names.slice(0,maxItems).reverse();return{color:PALETTE,tooltip:axisTooltip,legend:{top:30,data:D.map(d=>d.product)},grid:{left:155,right:35,top:72,bottom:30,containLabel:false},xAxis:{type:'value',axisLine:{show:false},axisTick:{show:false},axisLabel,splitLine},yAxis:{type:'category',data:use,axisLine:{show:false},axisTick:{show:false},axisLabel:{color:UI.ink,fontSize:11}},series:D.map((d,i)=>({name:d.product,type:'bar',barMaxWidth:12,data:use.map(n=>d[key].find(x=>x[1]===n)?.[2]||0)}))}}
function chart1(){return{tooltip:{...axisTooltip,formatter:p=>D.map((d,i)=>`${d.product}<br/>${p.seriesName}：${p.value}%`).join('<br/>')},legend:{top:6,data:['1星','2星','3星','4星','5星']},color:PALETTE.slice(0,5),grid:{left:130,right:34,top:58,bottom:34},xAxis:{type:'value',max:100,axisLine:{show:false},axisTick:{show:false},axisLabel:{...axisLabel,formatter:'{value}%'},splitLine},yAxis:{type:'category',data:D.map(d=>d.product),axisLine:{show:false},axisTick:{show:false},axisLabel:{color:UI.ink,fontSize:12}},series:[1,2,3,4,5].map(s=>({name:s+'星',type:'bar',stack:'total',barMaxWidth:34,data:D.map(d=>(d.rating.find(x=>x[1]===s)?.[3]||0)*100)}))}}
function chart2(){const c=axisBase();return{...c,tooltip:axisTooltip,legend:{top:6,data:D.map(d=>d.product)},color:PALETTE,grid:grid(),xAxis:{...c.xAxis,data:['1星','2星','3星','4星','5星']},series:D.map(d=>({name:d.product,type:'bar',barMaxWidth:28,data:[1,2,3,4,5].map(s=>d.rating.find(x=>x[1]===s)?.[2]||0)}))}}
function chart3(){const sentiment=i=>{const o=starmap(i);return[{name:'正面',value:o[4]+o[5]},{name:'混合/中性',value:o[3]},{name:'负面',value:o[1]+o[2]}]};return{color:PALETTE.slice(0,3),tooltip:itemTooltip,legend:{top:8,data:['正面','混合/中性','负面']},series:D.flatMap((d,i)=>({name:d.product,type:'pie',radius:['42%','66%'],center:[i?'74%':'26%','52%'],label:{formatter:'{b}\n{d}%',fontSize:11},labelLine:{length:8,length2:7},data:sentiment(i)}))}}
function chart4(){const names=['提及具体游戏','提及游戏品类/玩法','非游戏/未提及'];return{tooltip:axisTooltip,legend:{top:6,data:D.map(d=>d.product)},color:PALETTE,grid:{left:145,right:30,top:52,bottom:30},xAxis:{type:'value',max:100,axisLabel:{...axisLabel,formatter:'{value}%'},splitLine},yAxis:{type:'category',data:names,axisLine:{show:false},axisTick:{show:false},axisLabel:{color:UI.ink}},series:D.map(d=>({name:d.product,type:'bar',barMaxWidth:16,data:names.map(n=>(relation(D.indexOf(d),n)[3]||0)*100)}))}}

function chart8(){const names=[...new Set(D.flatMap(d=>d.genres.map(x=>x[1])))];return{tooltip:{...itemTooltip,formatter:p=>`${p.data[3]}<br/>产品：${p.seriesName}<br/>提及占比：${p.data[0].toFixed(1)}%<br/>平均星级：${p.data[1].toFixed(2)}<br/>评论数：${p.data[2]}`},legend:{top:6,data:D.map(d=>d.product)},color:PALETTE,grid:{left:58,right:32,top:50,bottom:46},xAxis:{type:'value',name:'提及占比(%)',min:0,max:Math.ceil(Math.max(...D.flatMap(d=>d.genres.map(x=>pct(x[3]))))/5)*5,axisLabel:{...axisLabel,formatter:'{value}%'},splitLine},yAxis:{type:'value',name:'平均星级',min:1,max:5,splitLine,axisLabel},series:D.map(d=>({name:d.product,type:'scatter',data:names.map(n=>{const x=d.genres.find(y=>y[1]===n);return x?[pct(x[3]),Number(x[4]),x[2],x[1]]:null}).filter(Boolean),symbolSize:v=>Math.max(10,Math.sqrt(v[2])*5),emphasis:{scale:1.2}}))}}
function chart9(){const r=D[1].games.filter(x=>x[2]==='本产品内容');return{tooltip:{...axisTooltip,formatter:p=>{const x=r[p.dataIndex];return `${x[1]}<br/>提及：${x[3]}条<br/>占产品评论：${pct(x[4])}%<br/>平均星级：${Number(x[5]).toFixed(2)}`}},grid:hgrid(),...valueBase(),yAxis:{type:'category',data:r.map(x=>x[1]).reverse(),axisLine:{show:false},axisTick:{show:false},axisLabel:{color:UI.ink}},series:[{type:'bar',data:r.map(x=>x[3]).reverse(),barMaxWidth:18,itemStyle:{color:PALETTE[0]}}]}}
function chart10(){const all=[];D.forEach(d=>d.games.filter(x=>x[2]==='外部对比/引用').forEach(x=>all.push(x)));all.sort((a,b)=>b[3]-a[3]);return{tooltip:{...axisTooltip,formatter:p=>{const x=all[p.dataIndex];return `${x[1]}<br/>提及：${x[3]}条<br/>平均星级：${Number(x[5]).toFixed(2)}`}},grid:hgrid(),...valueBase(),yAxis:{type:'category',data:all.map(x=>x[1]).reverse(),axisLine:{show:false},axisTick:{show:false},axisLabel:{color:UI.ink}},series:[{type:'bar',data:all.map(x=>x[3]).reverse(),barMaxWidth:18,itemStyle:{color:PALETTE[0]}}]}}

const CHARTS=[
{id:1,alias:'rating-share',section:'总体扫描',title:'各星级评论占比',render:chart1},
{id:2,alias:'rating-count',section:'总体扫描',title:'各星级评论数量',render:chart2},
{id:3,alias:'sentiment',section:'总体扫描',title:'产品整体情感结构',render:chart3},

{id:5,alias:'product-scale',section:'总体扫描',title:'评论规模与平均星级',render:chart5},
{id:6,alias:'genres-leapmove',section:'游戏类型与兴趣',title:'LeapFrog LeapMove 游戏品类',render:chart6},
{id:7,alias:'genres-nex',section:'游戏类型与兴趣',title:'Nex Playground 游戏品类',render:chart7},
{id:8,alias:'genre-matrix',section:'游戏类型与兴趣',title:'游戏品类偏好-满意度矩阵',render:chart8},
{id:9,alias:'games-nex',section:'具体游戏与IP',title:'Nex Playground 本产品游戏/IP',render:chart9},
{id:10,alias:'games-external',section:'具体游戏与IP',title:'外部对比游戏/IP',render:chart10},
{id:11,alias:'play-leapmove',section:'玩法与使用方式',title:'LeapFrog LeapMove 玩法与使用方式',render:chart11},
{id:12,alias:'play-nex',section:'玩法与使用方式',title:'Nex Playground 玩法与使用方式',render:chart12},
{id:13,alias:'age',section:'年龄与人群',title:'年龄段线索对比',render:chart13},
{id:14,alias:'audience',section:'年龄与人群',title:'目标人群结构',render:chart14},
{id:15,alias:'preference',section:'偏好强度',title:'游戏偏好强度分布',render:chart15},
{id:16,alias:'likes-leapmove',section:'为什么喜欢',title:'LeapFrog LeapMove 喜欢或认可原因',render:chart16},
{id:17,alias:'likes-nex',section:'为什么喜欢',title:'Nex Playground 喜欢或认可原因',render:chart17},

{id:20,alias:'platforms',section:'竞品与替代方案',title:'评论中引用的竞品或平台',render:chart20}
];
function renderIndex(){document.querySelector('.wrapper').style.display='none';const v=document.getElementById('indexView');v.style.display='block';document.getElementById('indexTable').querySelector('tbody').innerHTML=CHARTS.map(c=>`<tr><td><code>${c.id}</code></td><td><code>${c.alias}</code></td><td>${c.section} / ${c.title}</td></tr>`).join('')}
function getChart(){const p=new URLSearchParams(location.search);const id=(p.get('id')||'1').trim();if(id.toLowerCase()==='index')return{index:true};return CHARTS.find(c=>String(c.id)===id||c.alias===id)||CHARTS[0]}
const selected=getChart();if(selected.index){renderIndex()}else{if(!window.echarts){document.getElementById('errorView').style.display='block';document.getElementById('singleChart').style.display='none'}else{document.getElementById('chartTitle').textContent=selected.title;const chart=echarts.init(document.getElementById('singleChart'));chart.setOption(selected.render());window.addEventListener('resize',()=>chart.resize());setTimeout(()=>chart.resize(),100)}}
</script>
