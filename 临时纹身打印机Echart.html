                let y = sy,

                    if (m > 12) { m = 1;

                                        color: '#E9ECEF' } } },
                            series: s19
                        };
                        break;
                    }
                    case 20: { // 评分销量趋势-折线图
                        const data20 = [
                            [3.6, 39],
                            [3.9, 106],
                            [4.0, 1334],
                            [4.2, 3506],
                            [4.3, 7551],
                            [4.4, 24219],
                            [4.5, 28323],
                            [4.6, 45634],
                            [4.7, 54298],
                            [4.8, 17350],
                            [4.9, 424]
                        ];
                        const x20 = data20.map(r => r[0]);
                        const y20 = data20.map(r => r[1]);
                        option = {
                            tooltip: { trigger: 'axis', backgroundColor: 'rgba(0,0,0,0.7)',
                                textStyle: { color: '#fff' }, formatter: function(ps) { return '评分: ' + ps[0]
                                        .axisValue + '<br/>月销量: ' + ps[0].value.toLocaleString(); } },
                            legend: { show: false },
                            grid: { left: '3%', right: '4%', top: '8%', bottom: '3%', containLabel: true },
                            xAxis: { type: 'category', data: x20, name: '评分', axisLabel: { fontSize: 10 } },
                            yAxis: { type: 'value', name: '月销量', axisLabel: { formatter: v => v >= 10000 ? (v / 10000)
                                        .toFixed(1) + '万' : v }, splitLine: { lineStyle: { type: 'dashed',
                                        color: '#E9ECEF' } } },
                            color: [COLORS[0]],
                            series: [{ type: 'line', data: y20, smooth: true, symbol: 'circle', symbolSize: 6,
                                lineStyle: { width: 2.5, color: COLORS[0] }, itemStyle: { color: COLORS[0] },
                                areaStyle: { color: 'rgba(255,157,25,0.1)' } }]
                        };
                        break;
                    }
                    default:
                        option = {
                            title: { text: '暂无数据', left: 'center', top: 'center',
                            textStyle: { color: '#999' } },
                            series: []
                        };
                }
                return option;
            }

            const chartDom = document.getElementById('singleChart');
            let myChart = echarts.init(chartDom);
            const option = getChartOption(chartId);
            if (option) myChart.setOption(option);
            setTimeout(() => { myChart.resize(); }, 100);
            window.addEventListener('resize', () => { myChart.resize(); });
        })();
    </script>
