<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据可视化</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; margin:0; background:transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .wrapper { display:flex; flex-direction:column; height:100vh; width:100%; }
  .chart-title { flex-shrink:0; text-align:center; font-size:18px; font-weight:600; color:#1a1a2e; margin:16px 0 12px; }
  .chart-container { flex:1; width:100%; min-height:300px; }
  @media (max-width:768px) { .chart-title { font-size:16px; } .chart-container { min-height:250px; } }
</style>
</head>
<body>
<div class="wrapper">
  <div class="chart-title" id="chartTitle"></div>
  <div class="chart-container" id="singleChart"></div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<script>
(function () {
  'use strict';

  /* ========================= 基础配置 ========================= */
  var PALETTE = ['#FF9D19','#4682EB','#52C41A','#F5222D','#FAAD14','#0FC6C2','#722ED1','#EB2F96',
                 '#13C2C2','#7CB305','#B37FEB','#FF6B35','#4080FF','#FFBBA8','#95DE64','#FF7875'];

  var baseTooltip = {
    backgroundColor: 'rgba(0,0,0,0.7)',
    borderWidth: 0,
    padding: [8, 12],
    textStyle: { color: '#fff', fontSize: 12 },
    extraCssText: 'border-radius:4px;'
  };

  function num(v)  { return Number(v).toLocaleString('en-US'); }
  function num2(v) { return Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function shortNum(v) {
    var a = Math.abs(v);
    if (a >= 100000000) return (v / 100000000).toFixed(1) + '亿';
    if (a >= 10000)     return (v / 10000).toFixed(1) + '万';
    if (a >= 1000)      return (v / 1000).toFixed(1) + 'K';
    return String(v);
  }

  var catAxisBase = {
    type: 'category',
    axisLine: { lineStyle: { color: '#D9DEE4' } },
    axisTick: { show: false },
    axisLabel: { color: '#5a6472', fontSize: 11 },
    splitLine: { show: false }
  };

  var valAxisBase = {
    type: 'value',
    axisLine: { show: false },
    axisTick: { show: false },
    axisLabel: { color: '#5a6472', fontSize: 11 },
    splitLine: { show: true, lineStyle: { color: '#E9ECEF', type: 'dashed' } }
  };

  function emptyOption() {
    return {
      graphic: [{
        type: 'text',
        left: 'center',
        top: 'middle',
        style: { text: '暂无数据', fill: '#c2c8d2', fontSize: 16, fontWeight: 400 }
      }]
    };
  }

  /* ========================= 饼图通用构造 ========================= */
  function makePie(data, valueName) {
    valueName = valueName || '月销量';
    var many = data.length > 8;                 // 类别 > 8 时隐藏图例，标签前加彩色圆点
    var rich = {};
    PALETTE.forEach(function (c, i) {
      rich['d' + i] = { color: c, fontSize: 12, fontWeight: 'bold' };
    });

    var pieData = data.map(function (d, i) {
      return { name: d.name, value: d.value, itemStyle: { color: PALETTE[i % PALETTE.length] } };
    });

    return {
      color: PALETTE,
      tooltip: Object.assign({}, baseTooltip, {
        trigger: 'item',
        formatter: function (p) {
          return p.marker + ' ' + p.name + '<br/>' + valueName + '：' + num(p.value) + '（' + p.percent + '%）';
        }
      }),
      legend: many ? { show: false } : {
        type: 'scroll',
        orient: 'vertical',
        right: 16,
        top: 'middle',
        icon: 'circle',
        itemWidth: 10,
        itemHeight: 10,
        itemGap: 10,
        pageTextStyle: { color: '#4a4a68' },
        pageIconColor: '#4682EB',
        pageIconInactiveColor: '#ccc',
        textStyle: { color: '#4a4a68', fontSize: 12 }
      },
      series: [{
        type: 'pie',
        radius: many ? ['34%', '60%'] : ['36%', '58%'],
        center: many ? ['50%', '54%'] : ['38%', '54%'],
        minAngle: 3,
        avoidLabelOverlap: true,
        itemStyle: { borderWidth: 0 },
        label: many ? {
          show: true,
          position: 'outside',
          formatter: function (p) {
            return '{d' + (p.dataIndex % PALETTE.length) + '|●} ' + p.name + '\n' + p.percent + '%';
          },
          rich: rich,
          color: '#3a4252',
          fontSize: 12,
          lineHeight: 16
        } : {
          show: true,
          position: 'outside',
          formatter: '{b}\n{d}%',
          color: '#3a4252',
          fontSize: 12,
          lineHeight: 16
        },
        labelLine: { show: true, length: 12, length2: 16, lineStyle: { color: '#c8ced8' } },
        emphasis: { label: { fontSize: 13, fontWeight: 'bold' } },
        data: pieData
      }]
    };
  }

  /* ========================= 堆积柱状图通用构造 ========================= */
  function makeStackedBar(categories, seriesList, yName, valueUnit) {
    valueUnit = valueUnit || '';
    return {
      color: PALETTE,
      tooltip: Object.assign({}, baseTooltip, {
        trigger: 'axis',
        axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(0,0,0,0.04)' } },
        formatter: function (params) {
          var total = 0;
          params.forEach(function (p) { total += Number(p.value) || 0; });
          var s = '<b>' + params[0].axisValue + '</b>';
          params.forEach(function (p) {
            s += '<br/>' + p.marker + ' ' + p.seriesName + '：' + num(p.value) + valueUnit;
          });
          s += '<br/>合计：' + num(total) + valueUnit;
          return s;
        }
      }),
      legend: {
        top: 0, left: 'center', icon: 'circle', itemWidth: 10, itemHeight: 10,
        textStyle: { color: '#4a4a68', fontSize: 12 }
      },
      grid: { left: 10, right: 24, top: 50, bottom: 10, containLabel: true },
      xAxis: Object.assign({}, catAxisBase, { data: categories }),
      yAxis: Object.assign({}, valAxisBase, {
        name: yName || '',
        nameTextStyle: { color: '#5a6472', fontSize: 12 },
        axisLabel: { color: '#5a6472', fontSize: 11, formatter: shortNum }
      }),
      series: seriesList.map(function (s, i) {
        return {
          name: s.name,
          type: 'bar',
          stack: 'total',
          barMaxWidth: 42,
          itemStyle: { color: PALETTE[i % PALETTE.length] },
          emphasis: { focus: 'series' },
          data: s.data
        };
      })
    };
  }

  /* ========================= 时间轴（2022-01 ~ 2026-09，共57个月） ========================= */
  var MONTHS = (function () {
    var arr = [];
    for (var y = 2022; y <= 2026; y++) {
      for (var m = 1; m <= 12; m++) {
        if (y === 2026 && m > 9) break;
        arr.push(y + '-' + (m < 10 ? '0' + m : m));
      }
    }
    return arr;
  })();

  /* ========================= 20 个图表配置 ========================= */
  var chartTitles = [
    '分款销量占比',

    '产品属性销量占比',
    '产品属性销量占比',

        type: 'value',
        name: '月销量',
        nameTextStyle: { color: '#5a6472', fontSize: 12 },
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: { color: '#5a6472', fontSize: 11, formatter: shortNum },
        splitLine: { show: true, lineStyle: { color: '#E9ECEF', type: 'dashed' } }
      },
      series: series
    };
  })();

  /* ---------- (3) 产品属性销量占比 - 无数据 ---------- */
  chartOpts[2] = emptyOption();

  /* ---------- (4) 产品属性销量占比 - 无数据 ---------- */
  chartOpts[3] = emptyOption();

  /* ---------- (5) 关键词搜索量趋势 - 多系列折线图 ---------- */

      138755,135379,118561,107494,82756,122945,118465,152932,161483,171258,221789,235325,
      213434,181657,156726,145548,142014,149703,140288,138804,163771,179510,218889,221445,
      136389,140569,126106,98914,97038,122164,107189,106523,125126,128162,174901,178519,

      54400,47981,52975,50501,46648,51323,52891,56111,65814,86636,152413,168150,

        formatter: function (params) {
          var s = '<b>' + params[0].axisValue + '</b>';

      xAxis: Object.assign({}, catAxisBase, {
        data: MONTHS,

        axisLabel: { color: '#5a6472', fontSize: 11, interval: 5 }
      }),
      yAxis: Object.assign({}, valAxisBase, {
        name: '月搜索量',
        nameTextStyle: { color: '#5a6472', fontSize: 12 },
        axisLabel: { color: '#5a6472', fontSize: 11, formatter: shortNum }
      }),
      series: kwList.map(function (k, i) {
        return {
