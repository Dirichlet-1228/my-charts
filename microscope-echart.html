        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .chart-title {
            flex-shrink: 0;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 16px 0 12px;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }
        @media (max-width:768px) {
            .chart-title {
                font-size: 16px;
            }

            const chart19Styles = ['桌面按压式显微镜', '手持数码放大镜', '枪式手持数码显微镜', '台式套装', '手持光学显微镜', '分体式套装', '2合1显微/望远',
                'DV式手持显微镜'
            ];
            const chart19Data = [
                [1, 0, 0, 2, 0, 0, 0, 0],
                [0, 7, 2, 6, 4, 4, 0, 2],
                [14, 9, 17, 19, 2, 10, 3, 3],
                [3, 1, 2, 1, 0, 4, 0, 0]
            ];

            function buildChart19Option() {
                const xData = chart19Stars;
                const seriesArr = chart19Styles.map((name, idx) => ({
                    name: name,
                    type: 'bar',
                    stack: 'quality',
                    data: chart19Data.map(row => row[idx]),
                    itemStyle: { color: COLORS[idx % COLORS.length] },
                    barWidth: '50%',
                    label: { show: false },
                    emphasis: { focus: 'series' }
                }));
                return {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(0,0,0,0.7)',
                        borderColor: 'transparent',
                        textStyle: { color: '#fff' },
                        formatter: function(params) {
                            let html = '评分: ' + params[0].axisValue + '<br/>';
                            params.forEach(p => { if (p.value > 0) html += p.marker + ' ' + p.seriesName +
                                    ': ' + p.value + '<br/>'; });
                            return html;
                        }
                    },
                    legend: { data: chart19Styles, top: 5, textStyle: { fontSize: 10, color: '#333' },
                    type: 'scroll' },
                    grid: { left: '3%', right: '6%', top: '50px', bottom: '3%', containLabel: true },
                    xAxis: {
                        type: 'category',
                        data: xData,
                        axisLabel: { color: '#666', fontSize: 11 },
                        axisLine: { show: false },
                        axisTick: { show: false },
                        splitLine: { show: false }
                    },
                    yAxis: {
                        type: 'value',
                        axisLabel: { color: '#666', fontSize: 11 },
                        splitLine: { lineStyle: { color: '#E9ECEF', type: 'dashed' } },
                        axisLine: { show: false },
                        axisTick: { show: false }
                    },
                    series: seriesArr
                };
            }

            // ==================== 图表20：评分销量趋势 ====================
            const chart20Data = [
                [3.2, 34],
                [3.3, 19],
                [3.7, 179],
                [3.8, 216],
                [3.9, 320],
                [4.0, 476],
                [4.1, 428],
                [4.2, 3796],
                [4.3, 4272],
                [4.4, 8906],
                [4.5, 17327],
                [4.6, 16146],
                [4.7, 5434],
                [4.8, 1737],
                [4.9, 293]
            ];

            function buildChart20Option() {
                const xData = chart20Data.map(r => r[0].toFixed(1));
                const yData = chart20Data.map(r => r[1]);
                return {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(0,0,0,0.7)',
                        borderColor: 'transparent',
                        textStyle: { color: '#fff' },
                        formatter: function(params) {
                            return '评分: ' + params[0].axisValue + '<br/>月销量: ' + params[0].value
                                .toLocaleString();
                        }
                    },
                    grid: { left: '3%', right: '6%', top: '15px', bottom: '3%', containLabel: true },
                    xAxis: {
                        type: 'category',
                        data: xData,
                        name: '评分',
                        axisLabel: { color: '#666', fontSize: 11 },
                        axisLine: { show: false },
                        axisTick: { show: false },
                        splitLine: { show: false }
                    },
                    yAxis: {
                        type: 'value',
                        axisLabel: { formatter: fmtWan, color: '#666', fontSize: 11 },
                        splitLine: { lineStyle: { color: '#E9ECEF', type: 'dashed' } },
                        axisLine: { show: false },
                        axisTick: { show: false }
                    },
                    series: [{
                        type: 'line',
                        data: yData,
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 6,
                        lineStyle: { color: COLORS[0], width: 2.5 },
                        itemStyle: { color: COLORS[0] },
                        areaStyle: { color: 'rgba(255,157,25,0.1)' },
                        label: { show: false }
                    }]
                };
            }

            // ==================== 构建图表配置数组 ====================
            const chartOpts = [];

            // 图表1
            chartOpts.push(buildPieOption(pie1Data, '分款销量占比'));
            // 图表2
            chartOpts.push(buildHBarOption(bar2Data, '屏幕类型销量分布'));
            // 图表3
            chartOpts.push(buildHBarOption(bar3Raw, '放大系统销量分布'));
            // 图表4
            chartOpts.push(buildPieOption2(pie4Data));
            // 图表5
            (function() {
                const d5 = buildChart5Data();
                chartOpts.push(buildLineOption(d5.xAxisData, d5.series, '关键词搜索量趋势', fmtWan));
            })();
            // 图表6
            (function() {
                const d6 = buildChart6Data();
                chartOpts.push(buildLineOption(d6.xAxisData, d6.series, '关键词ABA排名趋势', function(v) { return v
                        .toLocaleString(); }));
            })();
            // 图表7
            chartOpts.push(buildChart7Option());
            // 图表8
            chartOpts.push(buildChart8Option());
            // 图表9
            chartOpts.push(buildSimplePieOption(pie9Data));
            // 图表10
            chartOpts.push(buildChart10Option());
            // 图表11
            chartOpts.push(buildSimplePieOption(pie11Data));
            // 图表12
            chartOpts.push(buildSimplePieOption(pie12Data));
            // 图表13
            chartOpts.push(buildSimplePieOption(pie13Data));
            // 图表14
            chartOpts.push(buildStackedBarOption(chart14Raw, ['老品', '新品'], 'review数分布'));
            // 图表15
            chartOpts.push(buildChart15Option());
            // 图表16
            chartOpts.push(buildStackedBarOption(chart16Data.map((row, i) => [chart16Prices[i], ...row]),
                chart16StarNames, '价格质量联动分析'));
            // 图表17
            chartOpts.push(buildStackedBarOption(chart17Data.map((row, i) => [chart17Prices[i], ...row]), ['白牌', '品牌'],
                '品牌价格分布'));
            // 图表18
            chartOpts.push(buildStackedBarOption(chart18Data.map((row, i) => [chart18Prices[i], ...row]), ['老品', '新品'],
                '新老品价格分布'));
            // 图表19
            chartOpts.push(buildChart19Option());
            // 图表20
            chartOpts.push(buildChart20Option());

            // ==================== 主逻辑 ====================
            const params = new URLSearchParams(window.location.search);
            let chartId = parseInt(params.get('id'));
            if (isNaN(chartId) || chartId < 1 || chartId > 20) chartId = 1;

            document.getElementById('chartTitle').textContent = chartTitles[chartId - 1];
            const chartDom = document.getElementById('singleChart');
            const myChart = echarts.init(chartDom);
            myChart.setOption(chartOpts[chartId - 1]);

            setTimeout(function() {
                myChart.resize();
            }, 100);

            window.addEventListener('resize', function() {
                myChart.resize();
            });
        })();
    </script>
</body>
</html>
