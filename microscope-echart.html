<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            margin: 0;
            background: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .chart-title {
            flex-shrink: 0;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 16px 0 12px;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }
        @media (max-width:768px) {
            .chart-title {
                font-size: 16px;
            }
            .chart-container {
                min-height: 250px;
            }
        }
    </style>

            // ==================== 工具函数 ====================
            function parseNum(val) {
                if (typeof val === 'number') return val;
                if (typeof val === 'string') {
                    return parseFloat(val.replace(/,/g, '')) || 0;
                }
                return 0;
            }

            function formatAxisLabel(val) {
                if (val >= 10000) {
                    return (val / 10000).toFixed(1).replace(/\.0$/, '') + '万';
                }
                if (val >= 1000) {
                    return (val / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
                }
                return val;
            }

            function formatPrice(val) {
                return '$' + parseNum(val).toFixed(2);
            }

            // 饼图label formatter：名称+百分比，分两行
            function pieLabelFormatter(p) {
                return '{name|' + p.name + '}\n{percent|' + p.percent.toFixed(1) + '%}';
            }

            // 饼图（>8类别）label formatter：带颜色圆点

            function renderChart() {
                const chartId = getChartId();

                // 设置标题

                // 销毁旧图表实例
                if (containerEl._echartInstance) {
                    containerEl._echartInstance.dispose();
                }

                // 初始化新图表
                const chart = echarts.init(containerEl);
                containerEl._echartInstance = chart;

                // 获取配置（函数需调用）

                const option = typeof optFunc === 'function' ? optFunc() : optFunc;

                // 设置图表

                // 延迟resize确保正确渲染

                    chart.resize();
                }, 100);
            }
