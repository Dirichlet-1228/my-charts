<html lang="zh-CN">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可视化图表看板</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            margin: 0;
            background: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .chart-title {
            flex-shrink: 0;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 16px 0 12px;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }
        @media (max-width:768px) {
            .chart-title {
                font-size: 16px;
            }
            .chart-container {
                min-height: 250px;
            }
        }
    </style>
</head>

            // ============ 工具函数：解析数字（去除逗号） ============
            function parseNum(val) {
                if (val === null || val === undefined || val === '-' || val === '' || val === '无数据') return null;
                if (typeof val === 'number') return val;
                return parseFloat(String(val).replace(/,/g, '')) || 0;
            }

            // ============ 工具函数：Y轴formatter（万单位） ============
            function formatAxisLabel(val) {
                if (val >= 10000) {
                    return (val / 10000).toFixed(val % 10000 === 0 ? 0 : 1) + '万';
                }
                return val;
            }

            // ============ 工具函数：生成饼图>8类别的rich标签配置 ============
            function buildPieRichLabels() {
                const rich = {};
                for (let i = 0; i < 16; i++) {
                    rich['dot' + i] = {
                        backgroundColor: COLORS[i],
                        width: 8,
                        height: 8,
                        borderRadius: 4,
                        display: 'inline-block',
                        verticalAlign: 'middle',
                        marginRight: 4,
                    };
                }
                return rich;
            }

            function pieLabelFormatterWithDot(params) {
                const idx = params.dataIndex % 16;
                return '{dot' + idx + '| }' + params.name + '\n{dot' + idx + '| }' + params.percent + '%';
            }

            function init() {

                let chartId = parseInt(params.get('id')) || 1;
                if (chartId < 1 || chartId > 20 || isNaN(chartId)) chartId = 1;
                const idx = chartId - 1;

                // 设置标题
                const titleEl = document.getElementById('chartTitle');
                titleEl.textContent = chartTitles[idx] || '';

                // 获取容器

                // 初始化ECharts

                const opt = chartOpts[idx];

                // 合并全局默认配置

                    backgroundColor: 'transparent',
                    animation: true,
                }, opt);

                // 确保grid等基础配置存在（对于饼图可能没有grid）

                // 延迟resize确保渲染完整

                    chart.resize();
                }, 100);

                // 监听resize

                    chart.resize();
                });

                // 清理旧的resize监听（避免多次初始化时重复绑定）
                // 使用一个标记来处理
                if (window._chartResizeHandler) {
                    window.removeEventListener('resize', window._chartResizeHandler);
                }
                window._chartResizeHandler = function() {
                    chart.resize();
                };
                window.addEventListener('resize', window._chartResizeHandler);
            }
